name: sprint-ci
on:
  push:
    branches: [sprint1, main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [horizon-via, horizon-client, horizon-protocol, horizon-mods, horizon-core]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: cargo check ${{ matrix.package }}
        run: cargo check -p ${{ matrix.package }}

  neoforge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Boot NeoForge 21.1.247 headless gate test
        run: |
          mkdir -p server && cd server
          curl -sL -o installer.jar https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.247/neoforge-21.1.247-installer.jar
          java -jar installer.jar --installServer . > install.log 2>&1 || tail -5 install.log
          echo "eula=true" > eula.txt
          # Fast boot check: server must reach "Done" without mods (gate harness base)
          timeout 300 bash -c 'java -Xmx3G @libraries/net/neoforged/neoforge/21.1.247/unix_args.txt nogui > boot.log 2>&1 || true'
          grep -q "Done" boot.log && echo "SERVER_BOOT_OK" || (echo "BOOT_FAIL"; tail -20 boot.log; exit 1)