          def check_ship_break(rcon, target):
              proof = {"plot_pos": None, "marker_before": False, "click_ok": False, "air_after": False}
              pos = target.get("pos") if isinstance(target, dict) else None
              if not isinstance(pos, list) or len(pos) != 3 or not all(type(v) is int for v in pos):
                  return proof
              x, y, z = pos
              # Default Sable 2.0.6 plot grid on this stand. A hit on ordinary terrain cannot pass.
              if not (20480000 <= x < 20742144 and 20480000 <= z < 20742144):
                  return proof
              proof["plot_pos"] = pos

              def matches(block):
                  # Keep the deck and its gold centre as witnesses if the plot disappears or changes.
                  cmd = (f"execute if block {x} {y-1} {z} minecraft:oak_planks "
                         f"if block {x+1} {y} {z+1} minecraft:gold_block "
                         f"if block {x} {y} {z} minecraft:{block}")
                  return rcon.cmd(cmd).strip() == "Test passed"

              proof["marker_before"] = matches("red_stained_glass")
              if not proof["marker_before"]:
                  return proof
              rc, out, err = ctl("mouse", "left", "click", timeout=15)
              summary["ship_break"] = (rc, out[:120], err[:120])
              try:
                  reply = json.loads(out)
              except ValueError:
                  reply = None
              proof["click_ok"] = rc == 0 and isinstance(reply, dict) and reply.get("ok") is True
              if proof["click_ok"]:
                  deadline = time.monotonic() + 5
                  while not matches("air"):
                      if time.monotonic() >= deadline:
                          return proof
                      time.sleep(0.2)
                  proof["air_after"] = True
              return proof


          def sample_ship_mobs(rcon, label):
              positions = {}
              for kind in ("pig", "chicken"):
                  selector = f"@e[type=minecraft:{kind},tag=ship_qa,limit=1]"
                  reply = rcon.cmd(f"data get entity {selector} Pos")
                  match = re.search(r"\[([^\[\]]+)\]\s*$", reply)
                  if match:
                      try:
                          xyz = [float(s.strip().rstrip("dD")) for s in match[1].split(",")]
                      except ValueError:
                          continue
                      if len(xyz) == 3 and all(math.isfinite(v) for v in xyz):
                          positions[kind] = xyz
              result = {"server": positions, "client": {}, "matches": False}
              deadline = time.monotonic() + 5
              while len(positions) == 2:
                  rc, out, _ = ctl("entities", "24", timeout=10)
                  if rc == 0:
                      try:
                          observed = json.loads(out)["entities"]
                      except (ValueError, KeyError, TypeError):
                          observed = []
                      if not isinstance(observed, list):
                          observed = []
                      client = {}
                      for kind in positions:
                          rows = [v for v in observed if isinstance(v, dict) and v.get("type") == f"minecraft:{kind}"]
                          if len(rows) == 1:
                              xyz = rows[0].get("pos")
                              if isinstance(xyz, list) and len(xyz) == 3 and all(
                                      type(v) in (int, float) and math.isfinite(v) for v in xyz):
                                  client[kind] = xyz
                      result["client"] = client
                      if len(client) == 2 and all(math.dist(client[k], p) <= 0.3 for k, p in positions.items()):
                          result["matches"] = True
                          break
                  if time.monotonic() >= deadline:
                      break
                  time.sleep(0.2)
              save(f"riders-{label}.json", json.dumps(result))
              return result


          def entity_uuid(rcon, command):
              match = re.search(r"\[I;\s*(-?\d+(?:,\s*-?\d+){3})\]\s*$", rcon.cmd(command))
              return tuple(map(int, match[1].split(","))) if match else None


          def sable_riders(rcon, x0, by, z0):
              pig = "@e[type=minecraft:pig,tag=ship_qa,limit=1]"
              chicken = "@e[type=minecraft:chicken,tag=ship_qa,limit=1]"
              rcon.cmd(f"summon minecraft:pig {x0+1.5} {by+2.2} {z0+1.5} "
                       '{Silent:1b,PersistenceRequired:1b,Tags:["ship_qa"]}')
              # Keep the carrier's normal movement tick so Sable can inherit the ship's motion.
              rcon.cmd(f"attribute {pig} minecraft:generic.movement_speed base set 0")
              rcon.cmd(f"summon minecraft:chicken {x0+1.5} {by+2.2} {z0+2.5} "
                       '{NoAI:1b,Silent:1b,Tags:["ship_qa"]}')
              time.sleep(2)
              pig_id = entity_uuid(rcon, f"data get entity {pig} UUID")
              chicken_id = entity_uuid(rcon, f"data get entity {chicken} UUID")
              mounted_cmd = f"execute as {chicken} on vehicle run data get entity @s UUID"
              mount_reply = rcon.cmd(f"ride {chicken} mount {pig}")
              mounted = (pig_id is not None and chicken_id is not None and pig_id != chicken_id
                         and " started riding " in mount_reply and entity_uuid(rcon, mounted_cmd) == pig_id)
              time.sleep(1)
              start = sample_ship_mobs(rcon, "before")
              save("riders-ship-before.txt", rcon.cmd("sable info @n"))
              x1, z1, x2, z2 = x0-1, z0-1, x0+3, z0+3
              # Lower the support floor so normal physics moves the settled raft four blocks.
              rcon.cmd(f"fill {x1} {by-5} {z1} {x2} {by-5} {z2} minecraft:smooth_stone")
              reply = rcon.cmd(f"fill {x1} {by-1} {z1} {x2} {by-1} {z2} minecraft:air")
              released = reply.strip().startswith("Successfully filled ")
              time.sleep(4)
              save("riders-ship-moved.txt", rcon.cmd("sable info @n"))
              end = sample_ship_mobs(rcon, "moved")
              displacements = {
                  side: {kind: [round(after - before, 3)
                                for before, after in zip(start[side][kind], end[side][kind])]
                         for kind in start[side].keys() & end[side].keys()}
                  for side in ("server", "client")
              }
              moved = (start["matches"] and end["matches"] and mounted and released
                       and entity_uuid(rcon, mounted_cmd) == pig_id
                       and abs(start["server"]["pig"][1] - (by+2)) <= 0.3
                       and abs(end["server"]["pig"][1] - (by-2)) <= 0.3
                       and all(math.dist(delta, (0, -4, 0)) <= 0.3
                               for positions in displacements.values() for delta in positions.values()))
              ctl("look-at", str(x0+1.5), str(by-1.25), str(z0+1.5), timeout=10)
              shots("65-riders-moved", [0.2])
              dismount_reply = rcon.cmd(f"ride {chicken} dismount")
              no_passengers = entity_uuid(rcon, f"execute unless data entity {pig} Passengers[0] "
                                          f"run data get entity {pig} UUID")
              unmounted = (mounted and " stopped riding " in dismount_reply and no_passengers == pig_id
                           and entity_uuid(rcon, f"data get entity {chicken} UUID") == chicken_id
                           and sample_ship_mobs(rcon, "dismount-before-tp")["matches"])
              landing = [x0+1.5, by, z0-1.5]
              rcon.cmd(f"tp {chicken} {landing[0]} {landing[1]} {landing[2]}")
              time.sleep(1)
              off = sample_ship_mobs(rcon, "dismounted")
              detached = (unmounted and off["matches"] and math.dist(off["server"]["chicken"], landing) <= 0.3
                          and math.dist(off["server"]["pig"], off["server"]["chicken"]) > 2)
              summary["ship_riders"] = {"mounted": mounted, "support_removed": released,
                                        "moved": moved, "dismounted_before_tp": unmounted, "detached": detached,
                                        "displacement": displacements}
              rcon.cmd(f"kill {chicken}")
              rcon.cmd(f"kill {pig}")


          def sable_ship(rcon, bx, by, bz):
              """ae-2: a Sable sub-level assembled from vanilla blocks by command (docs/sable-aeronautics-port.md
              phase 0), hanging 4 blocks above the platform, then left to fall under Sable's physics."""
              rcon.cmd("kill @e[type=!minecraft:player]")
              rcon.cmd(f"fill {bx-6} {by} {bz-6} {bx+6} {by+10} {bz+20} minecraft:air")
              # Earlier phases leave craters: a whole floor, or the raft and the player fall through.
              rcon.cmd(f"fill {bx-6} {by-1} {bz-6} {bx+6} {by-1} {bz+20} minecraft:smooth_stone")
              x0, y0, z0 = bx - 1, by + 4, bz + 8
              rcon.cmd(f"fill {x0} {y0} {z0} {x0+2} {y0} {z0+2} minecraft:oak_planks")
              rcon.cmd(f"fill {x0} {y0+1} {z0} {x0+2} {y0+1} {z0+2} minecraft:glass")
              rcon.cmd(f"setblock {x0} {y0+1} {z0} minecraft:red_stained_glass")
              rcon.cmd(f"setblock {x0+1} {y0+1} {z0+1} minecraft:gold_block")
              rcon.cmd(f"tp {NAME} {bx+0.5} {by} {bz+1.5} 0 -10")
              time.sleep(2)
              ctl("look", "0", "-10", timeout=10)
              shots("60-ship-built", [0.5])
              mark("sable_assemble")
              summary["sable_assemble"] = rcon.cmd(f"sable assemble area {x0} {y0} {z0} {x0+2} {y0+1} {z0+2}")[-200:]
              shots("61-ship", [0.5, 1.0, 2.0, 4.0], "status-ship.json")
              # Phase 5: stand on the landed ship (its glass top is ~2 blocks above the platform).
              rcon.cmd(f"tp {NAME} {x0+1.5} {by+3.2} {z0+1.5} 0 30")
              time.sleep(3)
              rc, state, _ = ctl("state", timeout=10)
              try:
                  pos = (json.loads(state).get("player") or {}).get("position")
              except ValueError:
                  pos = None
              summary["on_ship_position"] = pos
              shots("62-on-ship", [0.5])
              # Phase 6: break a ship block from beside the landed raft (its corner glass, world pose).
              rcon.cmd(f"tp {NAME} {x0+1.5} {by} {z0-2.5} 0 0")
              time.sleep(2)
              ctl("look-at", str(x0 + 0.5), str(by + 1.5), str(z0 + 0.5), timeout=10)
              time.sleep(0.5)
              shots("63-before-break", [0.2])
              # A ship block is not a world block (ctl break takes world positions): break it through the
              # crosshair, as a player would, so the client's ship picking chooses the target.
              target = status("status-before-ship-break.json").get("target")
              summary["ship_break_proof"] = check_ship_break(rcon, target)
              shots("64-after-break", [1.0])
              if os.environ.get("STAND_RIDERS") == "1":
                  sable_riders(rcon, x0, by, z0)
              with open(os.path.join(OUT, "client.err.log"), encoding="utf-8", errors="replace") as f:
                  summary["client_sable_lines"] = [l.strip()[:160] for l in f if "sable" in l.lower()][-12:]


          def main():
              password = secrets.token_urlsafe(18)
              print(f"::add-mask::{password}", flush=True)
              setup_server(password)
              write_states()
              summary["server"] = start_server()
              log(f"server ready={summary['server']}")
              if not summary["server"]:
                  return 1
              rcon = Rcon(password)
              summary["title"] = start_client()
              log(f"client at title={summary['title']}")
              if not summary["title"]:
                  return 1
              start_audio()
              mark("title")
              ctl("screenshot", os.path.join(OUT, "00-title.png"), timeout=30)
              status("status-title.json")
              rc, out, err = ctl("connect", f"127.0.0.1:{PORT}", NAME, timeout=60)
              mark("connect")
              rc, out, err = ctl("wait-for", "loaded", "--timeout", "240", timeout=300)
              summary["joined"] = rc == 0
              mark("joined" if rc == 0 else "join_failed")
              log(f"joined={summary['joined']}")
              ctl("screenshot", os.path.join(OUT, "01-after-connect.png"), timeout=30)
              with open(os.path.join(OUT, "client.err.log"), encoding="utf-8", errors="replace") as f:
                  reasons = [line.split("disconnected:", 1)[1].strip()[:160] for line in f if "disconnected:" in line]
              if reasons:
                  summary["disconnect"] = reasons[-1]
              rc, msgs, _ = ctl("messages", timeout=10)
              save("messages.json", msgs)
              if summary["joined"]:
                  fire(rcon)
                  time.sleep(3)
                  mark("after")
              st = status("status-end.json")
              summary["heard"] = st.get("heard")
              ctl("disconnect", timeout=15)
              ctl("quit", timeout=20)
              time.sleep(3)
              passed = summary["joined"] and summary["ship_break_proof"]["air_after"]
              if os.environ.get("STAND_RIDERS") == "1":
                  riders = summary.get("ship_riders", {})
                  passed = passed and riders.get("moved") and riders.get("detached")
              if os.environ.get("STAND_AERONAUTICS") == "1":
                  blocks = summary.get("aeronautics_blocks", {})
                  passed = passed and bool(blocks) and all(blocks.values())
              if os.environ.get("STAND_BEARING") == "1":
                  passed = passed and summary.get("bearing_assembly", {}).get("rotor_transferred")
              if os.environ.get("STAND_STEERING") == "1":
                  steering = summary.get("steering", {})
                  passed = passed and steering.get("held") and steering.get("angle_changed") and steering.get("released")
              if "cbc_6" in summary:
                  passed = (passed and all(result["passed"] for result in summary["cbc_5"].values())
                            and all(summary["cbc_6"].values()) and summary["cbc_7_impact"]
                            and summary["cbc_7_cracks"]["passed"])
              return 0 if passed else 1


          if __name__ == "__main__":
              code = 1
              try:
                  code = main()
              finally:
                  stop_audio()
                  for name in ("client", "server"):
                      p = procs.get(name)
                      if p and p.poll() is None:
                          if name == "server":
                              try:
                                  p.stdin.write(b"stop\n")
                                  p.stdin.flush()
                                  p.wait(timeout=90)
                              except Exception:
                                  p.kill()
                          else:
                              p.kill()
                  summary["audio"] = audio_peaks()
                  summary.pop("audio_t0", None)
                  save("summary.json", json.dumps(summary, indent=1))
                  print(json.dumps(summary, indent=1), flush=True)
              sys.exit(code)
          PY
          python3 "$RUNNER_TEMP/stand.py"
