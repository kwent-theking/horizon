          def start_audio():
              summary["audio_t0"] = time.monotonic()
              procs["parec"] = subprocess.Popen(["parec", "-d", "horizon.monitor", "--file-format=wav",
                                                 "--rate=44100", "--channels=2", os.path.join(OUT, "audio.wav")])


          def stop_audio():
              p = procs.get("parec")
              if p and p.poll() is None:
                  p.send_signal(signal.SIGINT)
                  try:
                      p.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      p.kill()


          def audio_peaks():
              """Loudness per 100 ms (peak of |sample|, 0..32767), and the louder windows' times."""
              path = os.path.join(OUT, "audio.wav")
              try:
                  w = wave.open(path, "rb")
              except (OSError, EOFError, wave.Error) as e:
                  return {"error": type(e).__name__}
              rate, channels, width = w.getframerate(), w.getnchannels(), w.getsampwidth()
              frames = w.readframes(w.getnframes())
              w.close()
              if width != 2:
                  return {"error": f"sample width {width}"}
              step = rate // 10 * channels
              samples = struct.unpack(f"<{len(frames) // 2}h", frames[: len(frames) // 2 * 2])
              windows = [max(map(abs, samples[i:i + step]), default=0) for i in range(0, len(samples), step)]
              loud = [[round(i / 10, 1), v] for i, v in enumerate(windows) if v > 300]
              return {"seconds": round(len(windows) / 10, 1), "max": max(windows, default=0),
                      "loud_windows": len(loud), "first_loud": loud[:40]}


