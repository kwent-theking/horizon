name: Horizon live stand (CI)
# A real NeoForge 21.1.265 server (Create, Create Big Cannons, Ritchie's Projectile Lib, loginbypass)
# and a real Horizon client on one runner: software Vulkan (lavapipe) under Xvfb, sound into a
# PulseAudio null sink recorded to WAV. Screenshots, status, logs and the WAV are encrypted to a
# throwaway certificate (the fork is public); only a summary of booleans and counts is printed.
on:
  push:
    branches: [ci/proto-d]
jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - name: Test the stand automation
        run: |
          python3 -I -S -B - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import zlib

          sources = json.loads(zlib.decompress(base64.b64decode("")))
          directory = Path(os.environ["RUNNER_TEMP"], "horizon-stand-automation")
          directory.mkdir()
          for name, source in sources.items():
              (directory / name).write_text(source, encoding="utf-8")
          PY
          python3 -I -S -B "$RUNNER_TEMP/horizon-stand-automation/test_stand_ci_driver.py" -v
  stand:
    if: ${{ true }}
    needs: automation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: [{"artifact": "stand-encrypted", "aeronautics": "0", "riders": "0", "bearing": "0", "steering": "0"}]
    env:
      STAND_AERONAUTICS: ${{ matrix.aeronautics }}
      STAND_RIDERS: ${{ matrix.riders }}
      STAND_BEARING: ${{ matrix.bearing }}
      STAND_STEERING: ${{ matrix.steering }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config mesa-vulkan-drivers libvulkan1 \
            xvfb pulseaudio pulseaudio-utils libasound2-plugins \
            libxkbcommon-x11-0 libxkbcommon0 libx11-xcb1 libxcursor1 libxi6 libxrandr2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build Horizon
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo build --profile fast -p horizon-client --bin horizon-client --bin horizon-ctl
          cargo build --profile fast -p horizon-prepare --bin horizon-prepare
          cargo build --profile fast -p horizon-port-pack --bin horizon-port-pack
      - name: Game files, as the official launcher installs them (sha1-checked)
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, urllib.request
          MC = os.path.expanduser("~/.minecraft")

          def get(url, sha1=None, path=None):
              for attempt in range(4):
                  try:
                      data = urllib.request.urlopen(url, timeout=120).read()
                      break
                  except OSError:
                      if attempt == 3:
                          raise
              if sha1 and hashlib.sha1(data).hexdigest() != sha1:
                  raise SystemExit(f"sha1 mismatch: {url}")
              if path:
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  with open(path, "wb") as f:
                      f.write(data)
              return data

          def allowed(rules):
              if not rules:
                  return True
              ok = False
              for rule in rules:
                  osr = rule.get("os")
                  if osr is None or osr.get("name") in (None, "linux"):
                      if "features" not in rule:
                          ok = rule["action"] == "allow"
              return ok

          # The version JSON Horizon's research lock pins (Mojang republishes the live one).
          pinned = json.load(open("research-lock.json", encoding="utf-8"))["minecraft"]["manifest_sha1"]
          raw = get(f"https://piston-meta.mojang.com/v1/packages/{pinned}/26.3.json", pinned,
                    f"{MC}/versions/26.3/26.3.json")
          version = json.loads(raw)
          d = version["downloads"]
          get(d["client"]["url"], d["client"]["sha1"], f"{MC}/versions/26.3/26.3.jar")
          server = os.path.join(os.environ["RUNNER_TEMP"], "server-26.3.jar")
          get(d["server"]["url"], d["server"]["sha1"], server)
          jobs = []
          for lib in version["libraries"]:
              art = lib.get("downloads", {}).get("artifact")
              if art and allowed(lib.get("rules")):
                  jobs.append((art["url"], art["sha1"], f"{MC}/libraries/{art['path']}"))
          ai = version["assetIndex"]
          index = json.loads(get(ai["url"], ai["sha1"], f"{MC}/assets/indexes/{ai['id']}.json"))
          for obj in index["objects"].values():
              h = obj["hash"]
              jobs.append((f"https://resources.download.minecraft.net/{h[:2]}/{h}", h, f"{MC}/assets/objects/{h[:2]}/{h}"))
          with concurrent.futures.ThreadPoolExecutor(32) as pool:
              list(pool.map(lambda j: get(*j), jobs))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"HORIZON_SERVER_JAR={server}\n")
          print(f"26.3: client, server, {len(jobs)} libraries and asset objects")
          PY
      - name: Prepare Minecraft 26.3 resources
        run: |
          start=$(date +%s)
          if ! target/fast/horizon-prepare --prepare --root "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/prepare.log" 2>&1; then
            tail -40 "$RUNNER_TEMP/prepare.log"; exit 1
          fi
          echo "prepared in $(( $(date +%s) - start )) s"
          # The sounds come from the launcher's asset objects, in a step of their own.
          if ! target/fast/horizon-prepare sounds --root "$GITHUB_WORKSPACE" >> "$RUNNER_TEMP/prepare.log" 2>&1; then
            tail -20 "$RUNNER_TEMP/prepare.log"; exit 1
          fi
          ls .local/horizon-client .local/horizon-client/26.3/assets | head -20
      - name: Fetch the stand's mods (official releases, sha512-checked)
        env:
          LOGINBYPASS_JAR_B64: ${{ secrets.LOGINBYPASS_JAR_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/mods"
          fetch() {
            curl --fail --location --retry 4 --max-time 180 "$1" --output "$RUNNER_TEMP/mods/$2"
            printf '%s  %s\n' "$3" "$RUNNER_TEMP/mods/$2" | sha512sum --check
          }
          fetch 'https://cdn.modrinth.com/data/LNytGWDc/versions/UjX6dr61/create-1.21.1-6.0.10.jar' \
            create-1.21.1-6.0.10.jar 11cc8fc049d2f67f6548c7abfada6b82a3adb5c7ca410a742de04bbca76e03862c518721b88d806f6e6d768a4d68531fdb903a85859b25d1484d550cc7bafd4b
          fetch 'https://cdn.modrinth.com/data/GWp4jCJj/versions/bOiDu0LS/createbigcannons-5.11.7%2Bmc.1.21.1.jar' \
            createbigcannons-5.11.7.jar 24f414dfbb973a0f4d9c9b2aa059edc7bed4d23b4f39eb1f7d23a1d6b437e3b5d64cca6e4b85ff7eb2815743fa711d54ad652bffe96d1eb1234544716006440d
          fetch 'https://cdn.modrinth.com/data/B3pb093D/versions/hZ6B2Z0x/ritchiesprojectilelib-2.1.2%2Bmc.1.21.1-neoforge.jar' \
            ritchiesprojectilelib-2.1.2.jar 6d64c84505a5a8fbb96d106603065465c5a2314ec09636900c5c1a31014c12fa68f1a41e758313cbf0d6f95d9a1f53bd67339020f7d8db0e184c23f66aee0330
          fetch 'https://cdn.modrinth.com/data/T9PomCSv/versions/fg9dTRz9/sable-neoforge-1.21.1-2.0.6.jar' \
            sable-neoforge-1.21.1-2.0.6.jar 76d293ce751a01cb9c095a3659b0a41e03e005480bc9d76dfdc73ec7c2eabf7923740c7b077921d42616673c496cd5143569f2085ddcebe174fd91d81e2a04b8
          if [ "$STAND_AERONAUTICS" = 1 ]; then
            fetch 'https://cdn.modrinth.com/data/oWaK0Q19/versions/44pLdPGg/create-aeronautics-bundled-1.21.1-1.3.2.jar' \
              aeronautics-bundle.jar dc7e8e1148fa442243889ba29412207137e1bb86206e6c92bc0a589f1374a466e93de22bdbf14f753984d86c29308fbbdc0f14a4b9618b14c0ac1666a36b46f5
          fi
          if [ -n "$LOGINBYPASS_JAR_B64" ]; then
            printf '%s' "$LOGINBYPASS_JAR_B64" | base64 -d > "$RUNNER_TEMP/mods/loginbypass-1.0.9.jar"
            printf '%s  %s\n' cedee1a81da564db5ef17accc81864ce1fd6c470319a41a3d16d9dadf803595421616f53a85f72c9c4a442ba1e4b803b9b893c91f141c73611dd9338be187507 \
              "$RUNNER_TEMP/mods/loginbypass-1.0.9.jar" | sha512sum --check
          else
            echo "no loginbypass: NeoForge's negotiation will refuse the Horizon client (smoke still checks the rest)"
          fi
      - name: Carry client content mods (horizon-port-pack)
        run: |
          trap 'tail -40 "$RUNNER_TEMP/port.log"' ERR
          mkdir -p "$RUNNER_TEMP/pack/mods" "$RUNNER_TEMP/game/horizon-mods"
          cp "$RUNNER_TEMP"/mods/create-*.jar "$RUNNER_TEMP"/mods/createbigcannons-*.jar \
             "$RUNNER_TEMP"/mods/ritchiesprojectilelib-*.jar "$RUNNER_TEMP/pack/mods/"
          ids=(create createbigcannons)
          if [ "$STAND_AERONAUTICS" = 1 ]; then
            # NeoForge loads the bundle. The pack importer reads individual mod jars.
            for id in aeronautics simulated offroad; do
              unzip -p "$RUNNER_TEMP/mods/aeronautics-bundle.jar" \
                "META-INF/jarjar/*.$id-neoforge-1.21.1-1.3.2.jar" > "$RUNNER_TEMP/pack/mods/$id.jar"
              test -s "$RUNNER_TEMP/pack/mods/$id.jar"
              ids+=("$id")
            done
          fi
          pp=target/fast/horizon-port-pack
          work="$RUNNER_TEMP/port"
          $pp import "$RUNNER_TEMP/pack" "$work" > "$RUNNER_TEMP/port.log" 2>&1
          $pp inventory "$work" >> "$RUNNER_TEMP/port.log" 2>&1
          $pp fetch "$work" --from "$RUNNER_TEMP/pack/mods" "${ids[@]}" >> "$RUNNER_TEMP/port.log" 2>&1
          start=$(date +%s)
          if ! $pp carry "$work" --resources .local/horizon-client/26.3 "${ids[@]}" >> "$RUNNER_TEMP/port.log" 2>&1; then
            tail -30 "$RUNNER_TEMP/port.log"; exit 1
          fi
          echo "carried in $(( $(date +%s) - start )) s"
          # Each carried mod is a folder mod (horizon-mod.toml inside), which horizon-mods/ takes as is.
          for id in "${ids[@]}"; do
            cp -r "$work/mods/$id/carry" "$RUNNER_TEMP/game/horizon-mods/$id"
            test -f "$RUNNER_TEMP/game/horizon-mods/$id/horizon-mod.toml"
          done
          ls -la "$RUNNER_TEMP/game/horizon-mods"
      - name: NeoForge server and the oracle jar
        env:
          HORIZON_NEOFORGE: '21.1.265'
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "tools")
          import neoforge_oracle as oracle
          home = oracle.install()
          jar = oracle.build(home)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"NEOFORGE_HOME={home}\nORACLE_JAR={jar}\n")
          print("neoforge home and oracle jar ready")
          PY
      - name: Display and sound
        run: |
          Xvfb :99 -screen 0 1600x900x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # The runtime dir first: PulseAudio puts its socket there, and the client looks there.
          mkdir -m 700 -p "$RUNNER_TEMP/xdg"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=horizon sink_properties=device.description=horizon
          pactl set-default-sink horizon
          printf 'pcm.!default pulse\nctl.!default pulse\n' > ~/.asoundrc
          pactl info | grep -E "Server Name|Default Sink"
      - name: Live stand
        timeout-minutes: 45
        run: |
          cat > "$RUNNER_TEMP/stand.py" <<'PY'
          """The CI live stand's driver (embedded into stand-ci-template.yml by build-stand-ci.py).

          Sets up the NeoForge server from $RUNNER_TEMP/mods, writes its state ids with the oracle, starts
          it with a per-run RCON password (masked), starts Horizon offscreen under Xvfb, records the
          PulseAudio null sink, joins, fires CBC's firing effects through RCON, and saves screenshots,
          status JSON, logs and the WAV to $RUNNER_TEMP/out-plain (encrypted by the next step). Prints only
          a summary of booleans and counts: the fork's logs are public.
          """
          import json
          import math
          import os
          import re
          import secrets
          import shutil
          import signal
          import socket
          import struct
          import subprocess
          import sys
          import time
          import wave
          import zipfile

          T = os.environ["RUNNER_TEMP"]
          W = os.environ["GITHUB_WORKSPACE"]
          HOME = os.environ["NEOFORGE_HOME"]
          ORACLE = os.environ["ORACLE_JAR"]
          OUT = os.path.join(T, "out-plain")
          SERVER = os.path.join(T, "server")
          GAME = os.path.join(T, "game")
          STATES = os.path.join(T, "states", "server-states.tsv")
          CLIENT = os.path.join(W, "target", "fast", "horizon-client")
          CTL = os.path.join(W, "target", "fast", "horizon-ctl")
          RES = os.path.join(W, ".local", "horizon-client", "26.3")
          ARGS = "@libraries/net/neoforged/neoforge/21.1.265/unix_args.txt"
          NAME = "tester"
          PORT, RCON_PORT = 25566, 25575
          os.makedirs(OUT, exist_ok=True)
          os.makedirs(GAME, exist_ok=True)
          summary = {"events": []}
          started = time.monotonic()
          procs = {}


          def log(msg):
              print(f"[{time.monotonic() - started:7.1f}s] {msg}", flush=True)


          def mark(name):
              """A timeline mark, to line the WAV up with what happened."""
              summary["events"].append([name, round(time.monotonic() - summary.get("audio_t0", started), 2)])


          def ctl(*args, timeout=15):
              r = subprocess.run([CTL, "--timeout", str(timeout), *args], cwd=GAME, capture_output=True,
                                 text=True, errors="replace", timeout=timeout + 30)
              return r.returncode, r.stdout.strip(), r.stderr.strip()


          def save(name, text):
              with open(os.path.join(OUT, name), "w", encoding="utf-8") as f:
                  f.write(text)


          def status(name):
              rc, out, _ = ctl("status", timeout=10)
              save(name, out)
              try:
                  return json.loads(out)
              except ValueError:
                  return {}


          def check_bearing_assembly(rcon, bx, by, bz):
              """Capture the pinned server's vanilla NBT when a real bearing assembles."""
              x, y, z = bx - 4, by, bz + 3
              pos = f"{x} {y} {z}"
              rotor = f"{x} {y} {z-1}"
              adjacent_sail = f"{x+1} {y} {z-1}"
              entity = "@e[type=aeronautics:propeller_bearing_contraption,limit=1]"
              initially_clear = entity_uuid(rcon, f"data get entity {entity} UUID") is None
              rcon.cmd(f"setblock {pos} aeronautics:propeller_bearing[facing=north]")
              # This bearing needs at least two blocks that count as sails.
              rcon.cmd(f"fill {rotor} {adjacent_sail} create:white_sail[facing=north]")
              rotor_present = rcon.cmd(f"execute if block {rotor} create:white_sail "
                                       f"if block {adjacent_sail} create:white_sail").strip() == "Test passed"
              rcon.cmd(f"setblock {x} {y} {z+1} create:shaft[axis=z]")
              rcon.cmd(f"setblock {x} {y} {z+2} create:creative_motor[facing=north]")
              rcon.cmd(f"clear {NAME}")
              rcon.cmd(f"tp {NAME} {x+2.5} {y} {z+0.5}")
              time.sleep(1)
              before = rcon.cmd(f"data get block {pos}")
              spawned = entity_uuid(rcon, f"data get entity {entity} UUID") is not None
              ctl("look-at-block", str(x), str(y), str(z), "east", timeout=10)
              target = status("status-before-bearing.json").get("target")
              aimed = isinstance(target, dict) and target.get("pos") == [x, y, z]
              clicked = not spawned and aimed and ctl("mouse", "right", "click", timeout=10)[0] == 0
              after = before
              if clicked:
                  deadline = time.monotonic() + 6
                  while time.monotonic() < deadline:
                      after = rcon.cmd(f"data get block {pos}")
                      if entity_uuid(rcon, f"data get entity {entity} UUID") is not None:
                          spawned = True
                          break
                      time.sleep(0.2)
              if spawned:
                  rcon.cmd(f"data get entity {entity}")
              assembled = (initially_clear and rotor_present and spawned
                           and rcon.cmd(f"execute if block {rotor} minecraft:air "
                                        f"if block {adjacent_sail} minecraft:air").strip() == "Test passed")
              save("bearing-block-before.txt", before)
              save("bearing-block-after.txt", after)
              shots("07-bearing-assembly", [0.2])
              summary["bearing_assembly"] = {"aimed": aimed, "clicked": clicked, "spawned": spawned,
                                             "rotor_transferred": assembled}
              # The bearing and its source are separate from the later raft fixture.
              rcon.cmd(f"setblock {pos} minecraft:air")
              rcon.cmd(f"kill {entity}")
              rcon.cmd(f"fill {x} {y} {z-1} {x+1} {y} {z+2} minecraft:air")


          def steering_target_angle(rcon, pos):
              reply = rcon.cmd(f"data get block {pos} TargetAngle")
              match = re.search(r"(-?\d+(?:\.\d+)?(?:[Ee][+-]?\d+)?)f\s*$", reply)
              return float(match[1]) if match else None


          def check_steering_wheel(rcon, bx, by, bz):
              """Check server input receipt and release using the server's update tag."""
              x, y, z = bx - 4, by, bz + 4
              pos = f"{x} {y} {z}"
              rcon.cmd(f"setblock {pos} simulated:steering_wheel[facing=north,on_floor=true,waterlogged=false]")
              rcon.cmd(f"clear {NAME}")
              rcon.cmd(f"tp {NAME} {x+0.5} {y} {z-1.5}")
              time.sleep(1)
              ctl("look-at-block", str(x), str(y), str(z), "north", timeout=10)
              target = status("status-before-steering.json").get("target")
              aimed = isinstance(target, dict) and target.get("pos") == [x, y, z]
              start = steering_target_angle(rcon, pos)

              def held(name, expected):
                  update = status(name).get("steering_wheel_server")
                  return (isinstance(update, dict) and update.get("pos") == [x, y, z]
                          and update.get("held") is expected)

              held_after_input = False
              released = False
              changed = False
              if aimed and start is not None and ctl("mouse", "right", "down", timeout=10)[0] == 0:
                  try:
                      ctl("mouse-move", "240", "0", timeout=10)
                      deadline = time.monotonic() + 6
                      while time.monotonic() < deadline:
                          held_after_input = held("status-holding-steering.json", True)
                          current = steering_target_angle(rcon, pos)
                          changed = current is not None and abs(current - start) >= 2
                          if held_after_input and changed:
                              break
                          time.sleep(0.2)
                  finally:
                      ctl("mouse", "right", "up", timeout=10)
                  if held_after_input:
                      deadline = time.monotonic() + 6
                      while time.monotonic() < deadline:
                          released = held("status-after-steering.json", False)
                          if released:
                              break
                          time.sleep(0.2)
              summary["steering"] = {"aimed": aimed, "held": held_after_input,
                                     "angle_changed": changed, "released": released}
              rcon.cmd(f"setblock {pos} minecraft:air")


          class Rcon:
              def __init__(self, password):
                  self.s = socket.create_connection(("127.0.0.1", RCON_PORT), timeout=20)
                  self.id = 0
                  if self._send(3, password)[0] == -1:
                      raise SystemExit("rcon auth failed")

              def _send(self, kind, body):
                  self.id += 1
                  data = body.encode("utf-8")
                  self.s.sendall(struct.pack("<iii", len(data) + 10, self.id, kind) + data + b"\0\0")
                  size = struct.unpack("<i", self._read(4))[0]
                  payload = self._read(size)
                  rid, _ = struct.unpack("<ii", payload[:8])
                  return rid, payload[8:-2].decode("utf-8", "replace")

              def _read(self, n):
                  buf = b""
                  while len(buf) < n:
                      chunk = self.s.recv(n - len(buf))
                      if not chunk:
                          raise ConnectionError("rcon closed")
                      buf += chunk
                  return buf

              def cmd(self, c):
                  out = self._send(2, c)[1]
                  with open(os.path.join(OUT, "rcon.log"), "a", encoding="utf-8") as f:
                      f.write(f"> {c}\n{out}\n")
                  return out


          def setup_server(password):
              os.makedirs(os.path.join(SERVER, "mods"))
              os.symlink(os.path.join(HOME, "libraries"), os.path.join(SERVER, "libraries"))
              for jar in os.listdir(os.path.join(T, "mods")):
                  shutil.copy(os.path.join(T, "mods", jar), os.path.join(SERVER, "mods", jar))
              with open(os.path.join(SERVER, "eula.txt"), "w") as f:
                  f.write("eula=true\n")
              # CBC's impact fuze detonates with chance 0.67 by default: always, for a repeatable stand.
              os.makedirs(os.path.join(SERVER, "defaultconfigs"))
              with open(os.path.join(SERVER, "defaultconfigs", "createbigcannons-server.toml"), "w") as f:
                  f.write("[munitions.fuzes]\n\timpactFuzeDetonationChance = 1.0\n")
              # The rider and gas fixtures both need summoned animals to survive on the server.
              with open(os.path.join(SERVER, "server.properties"), "w") as f:
                  f.write("\n".join([
                      "online-mode=false", f"server-port={PORT}", "enable-rcon=true", f"rcon.port={RCON_PORT}",
                      f"rcon.password={password}", "level-type=minecraft\\:flat", "view-distance=4",
                      "simulation-distance=4", "spawn-protection=0", "generate-structures=false",
                      "spawn-monsters=false", "spawn-animals=true", "max-tick-time=-1", ""]))


          def write_states():
              jar = os.path.join(SERVER, "mods", "horizon-oracle.jar")
              shutil.copy(ORACLE, jar)
              os.makedirs(os.path.dirname(STATES), exist_ok=True)
              with open(os.path.join(OUT, "oracle.log"), "wb") as f:
                  r = subprocess.run(["java", "-Xmx2G", f"-Dhorizon.oracle.stateids={STATES}", ARGS, "nogui"],
                                     cwd=SERVER, stdin=subprocess.DEVNULL, stdout=f, stderr=subprocess.STDOUT,
                                     timeout=600)
              os.remove(jar)
              shutil.rmtree(os.path.join(SERVER, "world"), ignore_errors=True)
              summary["states"] = os.path.exists(STATES)
              log(f"oracle state ids: rc={r.returncode} written={summary['states']}")


          def start_server():
              path = os.path.join(OUT, "server.log")
              procs["server"] = subprocess.Popen(["java", "-Xmx3G", ARGS, "nogui"], cwd=SERVER,
                                                 stdin=subprocess.PIPE, stdout=open(path, "wb"),
                                                 stderr=subprocess.STDOUT)
              t0 = time.time()
              while time.time() - t0 < 600:
                  if procs["server"].poll() is not None:
                      return False
                  with open(path, encoding="utf-8", errors="replace") as f:
