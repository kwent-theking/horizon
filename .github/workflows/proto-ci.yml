          def cbc_delta(before, after, section, name):
              return after.get(section, {}).get(name, 0) - before.get(section, {}).get(name, 0)


          def cbc_explosion_proof(rcon, kind, tag, summon, before, prefix, sounds, witness=None):
              after = status(f"status-{prefix}.json")
              cbc_before, cbc_after = before.get("cbc", {}), after.get("cbc", {})
              selector = f"@e[tag={tag},limit=1]"
              server = {"summon": summon[-160:], "projectile": rcon.cmd(f"data get entity {selector} Pos")[-160:]}
              if witness:
                  server["witness"] = rcon.cmd(f"data get entity {witness} Pos")[-160:]
              save(f"server-{prefix}.json", json.dumps(server))
              packets = cbc_delta(cbc_before, cbc_after, "explosions", kind)
              heard = {sound: cbc_delta(before, after, "heard", f"createbigcannons:{sound}") for sound in sounds}
              particle_names = {
                  "shrapnel": ("shrapnel_cloud", "shrapnel_smoke"),
                  "flak": ("flak_cloud", "flak_smoke"),
                  "fluid": ("fluid_cloud", "shrapnel_smoke"),
                  "mortar_stone": ("debris_smoke",),
                  "smoke": ("smoke_shell_smoke",),
              }[kind]
              particles = {name: cbc_delta(before, after, "particles", f"createbigcannons:{name}")
                           for name in particle_names}
              server_ok = "Summoned new " in server["summon"] and server["projectile"].strip() == "No entity was found"
              if witness:
                  server_ok = server_ok and bool(re.search(r"\[[^\[\]]+\]\s*$", server["witness"]))
              return {"packets": packets, "heard": heard, "particles": particles, "server": server_ok,
                      "passed": server_ok and packets == 1 and all(n > 0 for n in particles.values()) and all(n == 1 for n in heard.values())}


          def cbc_tracer_mesh(flight, previous):
              if not flight or (previous and flight["id"] == previous["id"]) or not flight.get("last"):
                  return False
              first, last = flight["first"], flight["last"]
              if last["position"][2] - first["position"][2] < 0.25:
                  return False
              # Both visible meshes must be anchored to the moving entity on the horizontal flight path.
              return all(sample["vertices"] >= 4 and all(lo <= 0.01 and hi >= -0.01
                                                          for lo, hi in zip(sample["min_offset"], sample["max_offset"]))
                         for sample in (first, last))


