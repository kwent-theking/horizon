              ctl("look", "0", "0", timeout=10)
              shots("40-cracks-before", [0.3])
              before = status("status-cbc-crack-before.json").get("cbc", {})
              proof = summary["cbc_7_cracks"] = {
                  "baseline_visible": cbc_crack_stage(before, target) is not None, "stage": None, "passed": False}
              # A summoned round must load the pinned JAR's durability_mass through ProjectileMass NBT.
              kind = "ap_autocannon"
              with zipfile.ZipFile(os.path.join(T, "mods", "createbigcannons-5.11.7.jar")) as jar:
                  with jar.open(f"data/createbigcannons/munition_properties/projectiles/{kind}.json") as data:
                      mass = float(json.load(data)["durability_mass"])
              proof["projectile_mass"] = mass
              shot_time = time.monotonic()
              clear_at_positive_stage = None
              for i in range(4):
                  mark(f"crack_shot_{i}")
                  rcon.cmd(f"summon createbigcannons:{kind} {bx+1.5} {by+1.6} {bz+4.0} "
                           f"{{Age:60,ProjectileMass:{mass}f,NoGravity:1b,Motion:[0.0d,0.0d,2.0d]}}")
                  time.sleep(0.15)
                  current = status(f"status-cbc-crack-shot-{i}.json").get("cbc", {})
                  stage = cbc_crack_stage(current, target)
                  intact = rcon.cmd(block_check).strip() == "Test passed"
                  if not intact:
                      break
                  if stage is not None and 1 <= stage <= 9:
                      clear_at_positive_stage = current.get("crack_clear")
                      proof["stage"] = stage
                      proof["stage_seconds"] = round(time.monotonic() - shot_time, 2)
                      shots("41-cracks-positive", [0])
                      break

              if proof["stage"] is None:
                  return
              # CBC heals 3 damage per second. The target must survive and an explicit packet must clear it.
              for i in range(24):
                  after = status("status-cbc-crack-healing.json").get("cbc", {})
                  if cbc_crack_stage(after, target) is None:
                      cleared = after.get("crack_clear")
                      proof["clear_packet"] = bool(cleared and cleared != clear_at_positive_stage and cleared[0] == target)
                      proof["intact_after"] = rcon.cmd(block_check).strip() == "Test passed"
                      proof["clear_seconds"] = round(time.monotonic() - shot_time, 2)
                      proof["passed"] = not proof["baseline_visible"] and proof["clear_packet"] and proof["intact_after"]
                      shots("42-cracks-cleared", [0])
                      break
                  time.sleep(0.5)


