              summary["content_mods"] = mods
              env = dict(os.environ, HORIZON_SERVER_STATES=STATES)
              procs["client"] = subprocess.Popen(
                  [CLIENT, "--resources", RES, "--control", "--offscreen", "--width", "1600", "--height", "900"],
