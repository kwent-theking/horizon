          def cracks(rcon, bx, by, bz):
              wall_z = bz + 7
              target = [bx+1, by+1, wall_z]
              block_check = f"execute if block {target[0]} {target[1]} {target[2]} minecraft:white_concrete"
              rcon.cmd("kill @e[type=!minecraft:player]")
              rcon.cmd(f"fill {bx-1} {by} {wall_z} {bx+3} {by+3} {wall_z} minecraft:white_concrete")
              rcon.cmd(f"tp {NAME} {bx+1.5} {by} {bz+2.5} 0 0")
